[project]
name = "clearsignal-worker"
version = "0.1.0"
description = "ClearSignal long-running ingest worker (Fly.io, Mumbai)"
requires-python = ">=3.8"   # runs on 3.12 in production (Dockerfile); 3.8+ kept for portability
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "apscheduler>=3.10,<4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
sar = [
  "dask-flood-mapper>=1.0",   # Sentinel-1 Bayesian flood mapping (TU Wien / interTwin)
  "pystac-client>=0.8",
  "odc-stac>=0.3",
]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
